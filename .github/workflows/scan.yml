name: Scan for jobs

on:
  schedule:
    # Runs at 4:00 and 12:00 UTC = 9:30 AM and 5:30 PM IST
    - cron: "0 4,12 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python job_scan.py

      - name: Commit updated state
        run: |
          git config user.name "job-scanner-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update seen jobs [skip ci]"
          git push
